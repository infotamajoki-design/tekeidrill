<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>外郎売 シャドーイング練習</title>
<style>
  :root {
    --ink: #2b2420;
    --paper: #faf6ee;
    --accent: #b5502e;
    --accent-dark: #8a3a1f;
    --line: #ddd0bd;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    color: var(--ink);
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", -apple-system, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 28px 24px 32px;
    box-shadow: 0 4px 18px rgba(60, 40, 20, 0.08);
    text-align: center;
  }
  .segment-label {
    font-size: 13px;
    letter-spacing: 0.1em;
    color: #8a7a63;
    margin-bottom: 4px;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 22px;
    font-weight: 700;
  }
  .play-btn {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    color: #fff;
    font-size: 34px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 22px;
    transition: transform 0.1s, background 0.15s;
    box-shadow: 0 3px 10px rgba(181, 80, 46, 0.35);
  }
  .play-btn:active { transform: scale(0.95); }
  .play-btn.playing { background: var(--accent-dark); }
  .play-icon::before { content: "▶"; margin-left: 4px; }
  .playing .play-icon::before { content: "❚❚"; margin-left: 0; }

  .progress-wrap {
    margin: 0 0 24px;
  }
  progress {
    width: 100%;
    height: 6px;
    appearance: none;
    -webkit-appearance: none;
  }
  progress::-webkit-progress-bar { background: var(--line); border-radius: 3px; }
  progress::-webkit-progress-value { background: var(--accent); border-radius: 3px; }
  progress::-moz-progress-bar { background: var(--accent); border-radius: 3px; }
  .time {
    font-size: 12px;
    color: #8a7a63;
    margin-top: 6px;
  }

  .speed-label {
    font-size: 13px;
    color: #8a7a63;
    margin-bottom: 10px;
  }
  .speed-row {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 26px;
  }
  .speed-btn {
    flex: 1;
    max-width: 110px;
    padding: 12px 0;
    border-radius: 10px;
    border: 1.5px solid var(--line);
    background: #fff;
    color: var(--ink);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .speed-btn small { display: block; font-weight: 400; font-size: 11px; color: #8a7a63; margin-top: 2px; }
  .speed-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .speed-btn.active small { color: #f6dcd0; }

  .nav-row {
    display: flex;
    justify-content: space-between;
    border-top: 1px solid var(--line);
    padding-top: 18px;
  }
  .nav-btn {
    background: none;
    border: none;
    color: var(--accent-dark);
    font-size: 14px;
    cursor: pointer;
    padding: 6px 10px;
  }
  .nav-btn:disabled { color: #ccc; cursor: default; }
  .all-link { font-size: 12px; color: #8a7a63; text-decoration: none; }

  .hint {
    margin-top: 16px;
    font-size: 12px;
    color: #a4977f;
    line-height: 1.6;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="segment-label" id="segLabel">SEGMENT --</div>
    <h1 id="title">外郎売 シャドーイング</h1>

    <button class="play-btn" id="playBtn" aria-label="再生・一時停止">
      <span class="play-icon"></span>
    </button>

    <div class="progress-wrap">
      <progress id="progress" value="0" max="100"></progress>
      <div class="time"><span id="curTime">0:00</span> / <span id="durTime">0:00</span></div>
    </div>

    <div class="speed-label">再生速度</div>
    <div class="speed-row">
      <button class="speed-btn" data-rate="0.75">0.75x<small>ゆっくり</small></button>
      <button class="speed-btn active" data-rate="1">1.0x<small>収録速度</small></button>
      <button class="speed-btn" data-rate="1.5">1.5x<small>通常速度</small></button>
    </div>

    <div class="nav-row">
      <button class="nav-btn" id="prevBtn">← 前のセグメント</button>
      <button class="nav-btn" id="nextBtn">次のセグメント →</button>
    </div>
    <div class="hint">
      <a class="all-link" href="index.html">← 全セグメント一覧へ</a>
    </div>
  </div>

  <audio id="audio" preload="metadata"></audio>

  <script>
    const TOTAL_SEGMENTS = 18;
    const params = new URLSearchParams(window.location.search);
    let seg = parseInt(params.get('seg'), 10);
    if (!seg || seg < 1) seg = 1;
    if (seg > TOTAL_SEGMENTS) seg = TOTAL_SEGMENTS;
    const segStr = String(seg).padStart(2, '0');

    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');
    const progress = document.getElementById('progress');
    const curTime = document.getElementById('curTime');
    const durTime = document.getElementById('durTime');
    const segLabel = document.getElementById('segLabel');
    const title = document.getElementById('title');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    segLabel.textContent = `SEGMENT ${segStr} / ${TOTAL_SEGMENTS}`;
    title.textContent = `外郎売 第${seg}回`;
    audio.src = `audio/${segStr}.mp3`;

    prevBtn.disabled = seg <= 1;
    nextBtn.disabled = seg >= TOTAL_SEGMENTS;
    prevBtn.addEventListener('click', () => {
      if (seg > 1) window.location.href = `player.html?seg=${String(seg - 1).padStart(2, '0')}`;
    });
    nextBtn.addEventListener('click', () => {
      if (seg < TOTAL_SEGMENTS) window.location.href = `player.html?seg=${String(seg + 1).padStart(2, '0')}`;
    });

    // 再生速度: 前回の選択を記憶
    const savedRate = parseFloat(localStorage.getItem('uirouri-rate') || '1');
    audio.playbackRate = savedRate;
    document.querySelectorAll('.speed-btn').forEach(btn => {
      const rate = parseFloat(btn.dataset.rate);
      if (rate === savedRate) {
        document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      }
      btn.addEventListener('click', () => {
        document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        audio.playbackRate = rate;
        localStorage.setItem('uirouri-rate', String(rate));
      });
    });

    function formatTime(sec) {
      if (!isFinite(sec)) return '0:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    playBtn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play();
      } else {
        audio.pause();
      }
    });
    audio.addEventListener('play', () => playBtn.classList.add('playing'));
    audio.addEventListener('pause', () => playBtn.classList.remove('playing'));
    audio.addEventListener('ended', () => playBtn.classList.remove('playing'));
    audio.addEventListener('loadedmetadata', () => {
      durTime.textContent = formatTime(audio.duration);
    });
    audio.addEventListener('timeupdate', () => {
      curTime.textContent = formatTime(audio.currentTime);
      if (audio.duration) progress.value = (audio.currentTime / audio.duration) * 100;
    });

    // QRから開いた直後、最初のタップで自動的に再生開始できるよう試みる
    // (ブラウザの自動再生制限があるため、確実なのは上の再生ボタンタップ)
    document.addEventListener('visibilitychange', () => {});
  </script>
</body>
</html>
