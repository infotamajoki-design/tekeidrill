<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>外郎売 シャドーイング音声一覧</title>
<style>
  :root { --ink:#2b2420; --paper:#faf6ee; --accent:#b5502e; --line:#ddd0bd; }
  * { box-sizing: border-box; }
  body {
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",-apple-system,sans-serif;
    padding: 32px 20px 60px; max-width: 480px; margin-inline:auto;
  }
  h1 { font-size:20px; margin-bottom:6px; }
  p.sub { font-size:13px; color:#8a7a63; margin-top:0; margin-bottom:24px; }
  ul { list-style:none; padding:0; margin:0; display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  li a {
    display:block; text-align:center; padding:16px 0; border-radius:10px;
    border:1.5px solid var(--line); background:#fff; color:var(--accent);
    font-weight:700; font-size:16px; text-decoration:none;
  }
  li a:active { background: var(--accent); color:#fff; }
</style>
</head>
<body>
  <h1>外郎売 シャドーイング音声</h1>
  <p class="sub">セグメントを選んで再生してください（各ページで再生速度を切り替えられます）</p>
  <ul id="list"></ul>
  <script>
    const ul = document.getElementById('list');
    for (let i = 1; i <= 18; i++) {
      const s = String(i).padStart(2, '0');
      const li = document.createElement('li');
      li.innerHTML = `<a href="player.html?seg=${s}">${i}</a>`;
      ul.appendChild(li);
    }
  </script>
</body>
</html>
